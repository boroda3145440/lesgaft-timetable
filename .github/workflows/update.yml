name: Обновление расписания

on:
  schedule:
    # каждый час с 06:10 до 22:10 по Москве (cron в UTC, МСК = UTC+3);
    # ночью расписание не правят — не дёргаем сервер вуза зря
    - cron: "10 3-19 * * *"
  workflow_dispatch:          # и вручную кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотека шифрования
        run: pip install --quiet cryptography

      - name: Выгрузка расписания из публикации вуза
        env:
          TIMETABLE_PASSWORD: ${{ secrets.TIMETABLE_PASSWORD }}
        run: python fetch_data.py

      - name: Коммит обновлённых данных
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "авто: обновление данных расписания"
          git push
