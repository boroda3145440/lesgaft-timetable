name: Обновление расписания

on:
  schedule:
    - cron: "15 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # и вручную кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Выгрузка расписания из публикации вуза
        run: python fetch_data.py

      - name: Коммит обновлённых данных
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "авто: обновление данных расписания"
          git push
